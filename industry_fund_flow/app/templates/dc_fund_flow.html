{% extends "app_layout.html" %}
{% block app_content %}
<div class="dashboard-top">
  <div class="dashboard-head">
    <div>
      <h1>{{ dimension.title }}</h1>
      <p class="muted">{{ dimension.subtitle }}</p>
    </div>
    <div class="dashboard-badges">
      <span class="status-badge">行业资金流</span>
      <span class="status-badge status-badge--success">实时更新</span>
    </div>
  </div>
  <div class="overview-cards">
    <div class="overview-card">
      <span>当前交易日</span>
      <strong id="summary-date">加载中</strong>
    </div>
    <div class="overview-card">
      <span>可选板块</span>
      <strong id="summary-total">-</strong>
    </div>
    <div class="overview-card">
      <span>当前筛选</span>
      <strong id="summary-filter">全部板块</strong>
    </div>
  </div>
</div>

<div class="card filters-card">
  <div class="filters">
    <label class="filter-field">
      <span>交易日期</span>
      <select id="trade-date"></select>
    </label>
    <label class="filter-field filter-field--wide">
      <span>板块类型</span>
      <div class="chip-group" id="content-type-chips">
        <button type="button" class="chip active" data-value="">全部</button>
        {% for ct in content_types %}
        <button type="button" class="chip" data-value="{{ ct }}">{{ ct }}</button>
        {% endfor %}
      </div>
    </label>
    <label class="filter-field filter-field--grow">
      <span>板块（默认全部，可输入名称/代码搜索后点选）</span>
      <div class="board-picker" id="board-picker">
        <div class="board-selected" id="board-selected"></div>
        <input
          type="text"
          id="board-search"
          class="board-search"
          placeholder="输入板块名称或代码，模糊匹配…"
          autocomplete="off"
        />
        <div class="board-dropdown hidden" id="board-dropdown"></div>
      </div>
    </label>
    <div class="filter-actions">
      <button type="button" class="btn btn-primary" id="btn-query">查询</button>
      <button type="button" class="btn btn-ghost" id="btn-reset-boards">清空板块</button>
    </div>
  </div>
  <div id="filter-hint" class="filter-hint muted"></div>
</div>

<div class="card table-card">
  <div class="table-toolbar">
    <span id="result-summary" class="muted">加载中…</span>
  </div>
  <div class="table-wrap">
    <table class="data-table" id="data-table">
      <thead><tr id="table-head"></tr></thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
  <div id="table-empty" class="table-empty hidden">暂无数据，请换交易日或放宽筛选条件</div>
  <div id="table-error" class="alert alert-error hidden"></div>
</div>

<section class="card charts-card">
  <div class="charts-head">
    <h2 class="section-title">近30日趋势</h2>
    <div class="charts-toolbar">
      <label class="filter-field filter-field--grow">
        <span>图表板块（可输入名称/代码搜索后点选）</span>
        <div class="board-picker" id="chart-board-picker">
          <div class="board-selected" id="chart-board-selected"></div>
          <input
            type="text"
            id="chart-board-search"
            class="board-search"
            placeholder="输入板块名称或代码，模糊匹配…"
            autocomplete="off"
          />
          <div class="board-dropdown hidden" id="chart-board-dropdown"></div>
        </div>
      </label>
      <div class="charts-toolbar-actions">
        <button type="button" class="btn btn-primary charts-refresh-btn" id="btn-chart-refresh">刷新图表</button>
        <button type="button" class="btn btn-ghost" id="btn-reset-chart-boards">恢复默认</button>
      </div>
    </div>
  </div>
  <div id="chart-error" class="alert alert-error hidden"></div>
  <div class="chart-grid">
    <div class="chart-box">
      <h3 class="chart-title">板块主力净流入趋势（亿）</h3>
      <div class="chart-canvas-wrap"><canvas id="chart-net-yi"></canvas></div>
    </div>
    <div class="chart-box">
      <h3 class="chart-title">板块主力净流入占比趋势（%）</h3>
      <div class="chart-canvas-wrap"><canvas id="chart-net-rate"></canvas></div>
    </div>
    <div class="chart-box">
      <h3 class="chart-title">板块资金流排名趋势</h3>
      <div class="chart-canvas-wrap"><canvas id="chart-rank"></canvas></div>
    </div>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script>
  window.__DC_PAGE__ = {{ dimension_json | safe }}
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="/static/js/dc_fund_flow.js"></script>
{% endblock %}
