{% extends "app_layout.html" %}
{% block app_content %}
<div class="page-head page-head--row">
  <div>
    <h1>选板块信号</h1>
    <p class="muted page-head-desc">按策略每日打分选板块（申万一级），标注新买 / 续持 / 剔除</p>
  </div>
  <div class="page-head-actions">
    <a href="/rotation/backtest" class="btn btn-ghost btn-sm">策略回测</a>
    <a href="/rotation/strategies" class="btn btn-ghost btn-sm">策略管理</a>
  </div>
</div>

<div id="page-error" class="alert alert-error hidden"></div>

<div class="card filters-card">
  <div class="filters">
    <label class="filter-field">
      <span>策略</span>
      <select id="sel-strategy" class="date-input"></select>
    </label>
    <label class="filter-field">
      <span>信号日期</span>
      <select id="sel-date" class="date-input"></select>
    </label>
    <div class="filter-actions">
      <button type="button" class="btn btn-primary" id="btn-query">刷新</button>
    </div>
  </div>
  <p class="muted" id="signal-hint">提示：信号由后台 ETL 每日生成（pro_dwm_rotation_signal_di.sh）。若为空，请先跑一次信号批处理。</p>
</div>

<section class="card table-card">
  <div class="table-toolbar">
    <span id="signal-updated" class="muted">—</span>
  </div>
  <div class="table-wrap">
    <table class="data-table" id="signal-table">
      <thead>
        <tr>
          <th>动作</th>
          <th>排名</th>
          <th>代码</th>
          <th>名称</th>
          <th>综合分</th>
          <th>收盘价</th>
          <th>因子明细</th>
          <th>记买卖点</th>
          <th>K线</th>
        </tr>
      </thead>
      <tbody id="signal-body"></tbody>
    </table>
  </div>
  <div id="signal-empty" class="table-empty hidden">暂无信号数据</div>
</section>
{% endblock %}

{% block scripts %}
<script src="/static/js/dc_board_common.js?v=20260715a"></script>
<script src="/static/js/rotation_signals.js?v=20260715a"></script>
{% endblock %}
