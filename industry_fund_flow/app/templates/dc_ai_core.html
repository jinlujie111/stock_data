{% extends "app_layout.html" %}
{% block app_content %}
<div class="page-head">
  <h1>AI 核心池</h1>
  <p class="muted">东财热度 Top 赛道 · AI/规则 归属评分 · S/A/B 核心池</p>
</div>

<div class="card filters-card">
  <div class="filters">
    <label class="filter-field">
      <span>交易日期</span>
      <select id="trade-date"></select>
    </label>
    <label class="filter-field filter-field--grow">
      <span>赛道搜索</span>
      <input type="text" id="track-keyword" placeholder="名称或板块代码…" />
    </label>
    <div class="filter-actions">
      <button type="button" class="btn btn-primary" id="btn-query">查询</button>
    </div>
  </div>
</div>

<div id="page-error" class="alert alert-error hidden"></div>

<div class="card">
  <h2>热度赛道</h2>
  <div class="table-wrap">
    <table class="data-table" id="tracks-table">
      <thead>
        <tr>
          <th>#</th>
          <th>赛道</th>
          <th>类型</th>
          <th>核心池数量</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="tracks-body"></tbody>
    </table>
  </div>
  <p id="tracks-empty" class="muted hidden">暂无赛道数据</p>
</div>

<div class="card hidden" id="pool-card">
  <h2 id="pool-title">核心池</h2>
  <div class="table-wrap">
    <table class="data-table">
      <thead>
        <tr>
          <th>代码</th>
          <th>名称</th>
          <th>等级</th>
          <th>评分</th>
          <th>权重</th>
          <th>环节</th>
          <th>原因</th>
        </tr>
      </thead>
      <tbody id="pool-body"></tbody>
    </table>
  </div>
  <p id="pool-empty" class="muted hidden">该赛道暂无核心池标的</p>
</div>
{% endblock %}

{% block app_scripts %}
<script src="/static/js/dc_ai_core.js"></script>
{% endblock %}
