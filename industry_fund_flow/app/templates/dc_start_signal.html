{% extends "app_layout.html" %}
{% block app_content %}
<style>
  .status-start { color: #f87171; font-weight: 700; }
  .status-watch { color: #fbbf24; font-weight: 600; }
  .status-drop { color: var(--muted); }
  .tag-incr {
    display: inline-block;
    padding: 0.12rem 0.45rem;
    border-radius: 999px;
    font-size: 0.72rem;
    background: rgba(34, 197, 94, 0.15);
    border: 1px solid rgba(34, 197, 94, 0.4);
    color: #86efac;
  }
  .summary-pills { display: flex; flex-wrap: wrap; gap: 0.6rem; margin: 0.75rem 0 0; }
  .summary-pill {
    padding: 0.35rem 0.75rem;
    border-radius: 8px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    font-size: 0.9rem;
  }
  .summary-pill strong { margin-left: 0.25rem; }
  .level-super { color: #fbbf24; font-weight: 600; }
  .level-main { color: #60a5fa; font-weight: 600; }
  .level-rotate { color: #a78bfa; }
  .level-follow { color: var(--muted); }
  .stage-tag {
    display: inline-block;
    padding: 0.15rem 0.5rem;
    border-radius: 6px;
    font-size: 0.75rem;
    background: rgba(59, 130, 246, 0.15);
    border: 1px solid rgba(59, 130, 246, 0.35);
  }
  .stage-tag.stage-burst { background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.4); }
  .stage-tag.stage-inst { background: rgba(34, 197, 94, 0.15); border-color: rgba(34, 197, 94, 0.4); }
  .stage-tag.stage-probe { background: rgba(251, 191, 36, 0.12); border-color: rgba(251, 191, 36, 0.35); }
  .score-parts { font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
  .rule-hint { margin-top: 0.5rem; line-height: 1.5; }
</style>

<div class="page-head">
  <h1>{{ title }}</h1>
  <p class="muted">{{ subtitle }}</p>
</div>

<div class="card filters-card">
  <div class="filters">
    <label class="filter-field">
      <span>交易日期</span>
      <input type="date" id="trade-date" class="date-input" />
    </label>
    <label class="filter-field filter-field--wide">
      <span>板块类型</span>
      <div class="chip-group" id="content-type-chips">
        {% for ct in content_types %}
        <button type="button" class="chip active" data-value="{{ ct }}">{{ ct }}</button>
        {% endfor %}
      </div>
    </label>
    <label class="filter-field filter-field--wide">
      <span>结论筛选</span>
      <div class="chip-group" id="status-chips">
        <button type="button" class="chip active" data-value="">全部</button>
        <button type="button" class="chip" data-value="启动">启动</button>
        <button type="button" class="chip" data-value="观察">观察</button>
        <button type="button" class="chip" data-value="放弃">放弃</button>
      </div>
    </label>
    <label class="filter-field">
      <span>TopN</span>
      <select id="top-n">
        <option value="50">50</option>
        <option value="100" selected>100</option>
        <option value="200">200</option>
      </select>
    </label>
    <div class="filter-actions">
      <button type="button" class="btn btn-primary" id="btn-query">查询</button>
    </div>
  </div>
  <p id="rule-hint" class="muted rule-hint"></p>
  <div id="filter-hint" class="filter-hint muted"></div>
</div>

<div id="page-error" class="alert alert-error hidden"></div>

<section class="card">
  <div class="snapshot-head">
    <div>
      <h2 class="section-title">启动信号榜</h2>
      <p id="rank-updated" class="muted snapshot-time"></p>
      <div class="summary-pills" id="summary-pills"></div>
    </div>
  </div>
  <div class="table-wrap">
    <table class="data-table" id="rank-table">
      <thead>
        <tr>
          <th>#</th>
          <th>结论</th>
          <th>增量资金</th>
          <th>类型</th>
          <th>板块</th>
          <th>综合分</th>
          <th>四维分</th>
          <th>主线等级</th>
          <th>阶段</th>
          <th>净流入天</th>
          <th>资金加速</th>
          <th>VP</th>
          <th>量价信号</th>
          <th>龙头</th>
          <th>命中</th>
        </tr>
      </thead>
      <tbody id="rank-body"></tbody>
    </table>
  </div>
  <div id="rank-empty" class="table-empty hidden">暂无数据，请换交易日或放宽筛选</div>
</section>
{% endblock %}
{% block scripts %}
<script>
  window.__START_SIGNAL_PAGE__ = {
    mode: {{ mode | tojson }},
    {{ title | tojson }}
  }
</script>
<script src="/static/js/dc_board_common.js?v=20260626"></script>
<script src="/static/js/dc_start_signal.js?v=20260708"></script>
{% endblock %}
