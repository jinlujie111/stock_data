{% extends "app_layout.html" %}
{% block app_content %}
<style>
  .chart-card { margin-bottom: 1rem; }
  .chart-box { width: 100%; min-height: 280px; }
  .chart-svg { width: 100%; height: 320px; display: block; }
  .chart-legend { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 0.75rem; }
  .legend-item { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.9rem; }
  .legend-dot { width: 10px; height: 10px; border-radius: 999px; display: inline-block; }
  .toolbar-note { margin-top: 0.5rem; }
</style>

<div class="page-head">
  <h1>波动率</h1>
  <p class="muted">大盘与东财板块近 1 年年化波动率走势（20日 / 60日）</p>
</div>

<div class="card filters-card">
  <div class="filters">
    <label class="filter-field">
      <span>交易日期</span>
      <select id="trade-date"></select>
    </label>
    <label class="filter-field">
      <span>波动率窗口</span>
      <select id="window">
        <option value="20" selected>20日年化波动率</option>
        <option value="60">60日年化波动率</option>
      </select>
    </label>
    <label class="filter-field">
      <span>板块类型</span>
      <select id="content-types">
        <option value="行业,概念">行业+概念</option>
        <option value="行业">行业</option>
        <option value="概念">概念</option>
      </select>
    </label>
    <label class="filter-field filter-field--grow">
      <span>板块（默认全部，可输入名称/代码搜索后点选）</span>
      <div class="board-picker" id="board-picker">
        <div class="board-selected" id="board-selected"></div>
        <input type="text" id="board-search" class="board-search" placeholder="输入板块名称或代码，模糊匹配…" autocomplete="off" />
        <div class="board-dropdown hidden" id="board-dropdown"></div>
      </div>
    </label>
    <div class="filter-actions">
      <button type="button" class="btn btn-primary" id="btn-query">查询</button>
      <button type="button" class="btn btn-ghost" id="btn-reset-boards">清空板块</button>
    </div>
  </div>
</div>

<div id="page-error" class="alert alert-error hidden"></div>

<section class="card chart-card">
  <div class="snapshot-head">
    <div>
      <h2 class="section-title">大盘年化波动率</h2>
      <p class="muted toolbar-note">上证综指与沪深300近 1 年对比</p>
    </div>
  </div>
  <div id="market-chart" class="chart-box"></div>
  <div id="market-legend" class="chart-legend"></div>
</section>

<section class="card chart-card">
  <div class="snapshot-head">
    <div>
      <h2 class="section-title">板块年化波动率</h2>
      <p class="muted toolbar-note">支持多板块对比，未选板块时展示默认常看板块</p>
    </div>
  </div>
  <div id="industry-chart" class="chart-box"></div>
  <div id="industry-legend" class="chart-legend"></div>
</section>

<section class="card">
  <div class="snapshot-head">
    <div>
      <h2 class="section-title">板块波动率排行</h2>
      <p class="muted toolbar-note">按当前选择窗口的年化波动率从高到低排序</p>
    </div>
  </div>
  <div class="table-wrap">
    <table class="data-table">
      <thead>
        <tr>
          <th>#</th>
          <th>板块</th>
          <th>类型</th>
          <th>收盘点位</th>
          <th>涨跌幅</th>
          <th>20日年化波动率</th>
          <th>60日年化波动率</th>
          <th>K线分析</th>
        </tr>
      </thead>
      <tbody id="rank-body"></tbody>
    </table>
  </div>
  <p id="rank-empty" class="muted hidden">暂无波动率数据，请先执行波动率批处理。</p>
</section>
{% endblock %}

{% block scripts %}
<script src="/static/js/dc_board_common.js?v=20260710d"></script>
<script src="/static/js/dc_volatility.js?v=20260710d"></script>
{% endblock %}
