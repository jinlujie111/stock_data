{% extends "app_layout.html" %}
{% block app_content %}
<div class="page-head page-head--row">
  <div>
    <h1>选板块回测</h1>
    <p class="muted page-head-desc">申万一级行业轮动回测（动量/反转状态机 + 资金流），查看净值曲线、绩效与逐笔交易</p>
  </div>
  <div class="page-head-actions">
    <a href="/rotation/signals" class="btn btn-ghost btn-sm">选板块信号</a>
    <a href="/rotation/strategies" class="btn btn-ghost btn-sm">选板块策略</a>
  </div>
</div>

<div id="page-error" class="alert alert-error hidden"></div>

<div class="card filters-card">
  <div class="filters">
    <label class="filter-field">
      <span>策略</span>
      <select id="sel-strategy" class="date-input"></select>
    </label>
    <label class="filter-field">
      <span>开始日期</span>
      <input type="date" id="bt-start" class="date-input" value="2026-01-01" />
    </label>
    <label class="filter-field">
      <span>结束日期</span>
      <input type="date" id="bt-end" class="date-input" />
    </label>
    <label class="filter-field">
      <span>初始资金</span>
      <input type="number" id="bt-capital" class="date-input" value="1000000" step="10000" />
    </label>
    <div class="filter-actions">
      <button type="button" class="btn btn-primary" id="btn-run">开始回测</button>
    </div>
  </div>
  <p class="muted" id="bt-hint">回测在后台执行，完成后自动展示。区间越长耗时越久（数据自 2026 年起）。</p>
</div>

<section class="card table-card">
  <div class="table-toolbar"><span class="muted">历史回测</span></div>
  <div class="table-wrap">
    <table class="data-table" id="runs-table">
      <thead>
        <tr>
          <th>ID</th><th>策略</th><th>区间</th><th>状态</th>
          <th>总收益</th><th>年化</th><th>最大回撤</th><th>夏普</th>
          <th>胜率</th><th>交易数</th><th>基准</th><th>查看</th>
        </tr>
      </thead>
      <tbody id="runs-body"></tbody>
    </table>
  </div>
  <div id="runs-empty" class="table-empty hidden">暂无回测记录</div>
</section>

<section class="card" id="bt-detail" style="display:none">
  <div class="table-toolbar"><span id="detail-title" class="muted">—</span></div>
  <div id="nav-chart"></div>
  <div class="metrics-row" id="detail-metrics"></div>
  <div class="table-wrap" style="margin-top:12px">
    <table class="data-table" id="trades-table">
      <thead>
        <tr>
          <th>日期</th><th>方向</th><th>代码</th><th>名称</th><th>价格</th>
          <th>股数</th><th>盈亏</th><th>收益率</th><th>持有天</th><th>原因</th>
        </tr>
      </thead>
      <tbody id="trades-body"></tbody>
    </table>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script src="/static/js/dc_board_common.js?v=20260715a"></script>
<script src="/static/js/rotation_backtest.js?v=20260715a"></script>
{% endblock %}
