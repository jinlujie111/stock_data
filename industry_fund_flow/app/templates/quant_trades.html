{% extends "app_layout.html" %}
{% block app_content %}
<div class="page-head page-head--row">
  <div>
    <h1>买卖点记录</h1>
    <p class="muted page-head-desc">手动或从信号记录买卖点，追踪持仓与浮动盈亏</p>
  </div>
  <div class="page-head-actions">
    <a href="/quant/signals" class="btn btn-ghost btn-sm">选股信号</a>
    <a href="/quant/backtest" class="btn btn-ghost btn-sm">策略回测</a>
  </div>
</div>

<div id="page-error" class="alert alert-error hidden"></div>

<div class="card filters-card">
  <div class="filters" style="flex-wrap:wrap;gap:12px">
    <label class="filter-field"><span>代码</span>
      <input id="t-code" class="date-input" placeholder="600519.SH" /></label>
    <label class="filter-field"><span>名称</span>
      <input id="t-name" class="date-input" placeholder="可留空" /></label>
    <label class="filter-field"><span>方向</span>
      <select id="t-side" class="date-input"><option value="BUY">买入</option><option value="SELL">卖出</option></select>
    </label>
    <label class="filter-field"><span>日期</span><input type="date" id="t-date" class="date-input" /></label>
    <label class="filter-field"><span>价格</span><input type="number" id="t-price" class="date-input" step="0.01" /></label>
    <label class="filter-field"><span>股数</span><input type="number" id="t-shares" class="date-input" step="100" placeholder="可留空" /></label>
    <label class="filter-field filter-field--grow"><span>备注</span><input id="t-note" class="date-input" /></label>
    <div class="filter-actions"><button type="button" class="btn btn-primary" id="btn-add">记录</button></div>
  </div>
</div>

<section class="card table-card">
  <div class="table-toolbar"><span class="muted">当前持仓（按买卖点净额估算）</span></div>
  <div class="table-wrap">
    <table class="data-table" id="pos-table">
      <thead>
        <tr><th>代码</th><th>名称</th><th>净股数</th><th>成本价</th><th>现价</th><th>市值</th><th>浮动盈亏</th><th>浮动收益率</th></tr>
      </thead>
      <tbody id="pos-body"></tbody>
    </table>
  </div>
  <div id="pos-empty" class="table-empty hidden">暂无持仓</div>
</section>

<section class="card table-card">
  <div class="table-toolbar"><span class="muted">买卖点历史</span></div>
  <div class="table-wrap">
    <table class="data-table" id="log-table">
      <thead>
        <tr><th>日期</th><th>方向</th><th>代码</th><th>名称</th><th>价格</th><th>股数</th><th>金额</th><th>来源</th><th>备注</th><th>操作</th></tr>
      </thead>
      <tbody id="log-body"></tbody>
    </table>
  </div>
  <div id="log-empty" class="table-empty hidden">暂无买卖点记录</div>
</section>
{% endblock %}

{% block scripts %}
<script src="/static/js/dc_board_common.js?v=20260715a"></script>
<script src="/static/js/quant_trades.js?v=20260715a"></script>
{% endblock %}
