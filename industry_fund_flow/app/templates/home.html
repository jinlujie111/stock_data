{% extends "app_layout.html" %}
{% block app_content %}
<div class="page-head">
  <h1>欢迎，{{ user.username }}</h1>
  <p class="muted">沪深 A 股全市场广度概览。</p>
</div>

<section class="card breadth-card">
  <div class="breadth-head">
    <div>
      <h2 class="section-title">市场广度</h2>
      <p id="breadth-summary" class="muted section-desc">加载中…</p>
    </div>
    <label class="filter-field breadth-date-field">
      <span>交易日期</span>
      <input type="date" id="breadth-date" class="date-input" />
    </label>
  </div>
  <div id="breadth-error" class="alert alert-error hidden"></div>
  <div id="breadth-metrics" class="metric-grid"></div>
  <div id="breadth-empty" class="table-empty hidden">该交易日暂无市场广度数据</div>

  <div class="breadth-trend">
    <h3 class="breadth-trend-title">近30日涨跌家数趋势</h3>
    <div id="breadth-trend-empty" class="table-empty hidden">暂无趋势数据</div>
    <div id="breadth-trend-chart"></div>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script src="/static/js/dc_board_common.js?v=20260626"></script>
<script src="/static/js/home.js?v=20260626"></script>
{% endblock %}
