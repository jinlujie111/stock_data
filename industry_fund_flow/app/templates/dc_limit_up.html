{% extends "app_layout.html" %}
{% block app_content %}
<style>
  .ladder-summary { margin-bottom: 1rem; font-size: 0.875rem; color: var(--muted); }
  .ladder-section { margin-bottom: 1.5rem; }
  .ladder-section-head {
    display: flex; align-items: baseline; gap: 0.5rem;
    margin-bottom: 0.75rem; padding-bottom: 0.5rem;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .ladder-section-head h3 { font-size: 1rem; font-weight: 600; margin: 0; }
  .ladder-section-count { font-size: 0.8125rem; color: var(--muted); font-weight: 400; }
  .ladder-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
    gap: 0.65rem;
  }
  .ladder-card {
    position: relative;
    padding: 0.65rem 0.75rem;
    border-radius: 10px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    cursor: default;
  }
  .ladder-card-name {
    font-size: 0.875rem; font-weight: 600; color: #60a5fa;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    padding-right: 1.25rem;
  }
  .ladder-card-industry {
    font-size: 0.7rem; font-weight: 400; color: #93c5fd; margin-left: 0.25rem;
  }
  .ladder-card-stat {
    margin-top: 0.35rem; font-size: 0.75rem; font-weight: 500;
  }
  .ladder-card-code {
    margin-top: 0.2rem; font-size: 0.68rem; color: var(--muted);
  }
  .ladder-card-add {
    position: absolute; top: 0.4rem; right: 0.45rem;
    border: none; background: transparent; color: #f59e0b;
    font-size: 1rem; line-height: 1; cursor: pointer; padding: 0;
  }
  .ladder-card-add:hover { color: #fbbf24; }
  .ladder-empty-section { font-size: 0.8125rem; color: var(--muted); padding: 0.25rem 0; }
</style>

<div class="page-head">
  <h1>涨停分析</h1>
  <p class="muted">东方财富 · 涨停天梯（按连板数分组：一板至五板以上）</p>
</div>

<div id="page-error" class="alert alert-error hidden"></div>

<div class="card filters-card">
  <div class="filters">
    <label class="filter-field">
      <span>交易日期</span>
      <input type="date" id="trade-date" class="date-input" />
    </label>
    <div class="filter-actions">
      <button type="button" class="btn btn-primary" id="btn-query">查询</button>
    </div>
  </div>
  <p id="filter-hint" class="filter-hint muted"></p>
</div>

<section class="card" id="ladder-card">
  <p id="ladder-summary" class="ladder-summary">—</p>
  <div id="ladder-body"></div>
  <div id="ladder-empty" class="table-empty hidden">该交易日暂无涨停数据</div>
</section>
{% endblock %}

{% block scripts %}
<script src="/static/js/dc_board_common.js?v=20260714b"></script>
<script src="/static/js/dc_limit_up.js?v=20260710d"></script>
{% endblock %}
