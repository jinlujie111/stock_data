{% extends "app_layout.html" %}
{% block app_content %}
<style>
  .sentiment-layout {
    display: grid;
    gap: 1rem;
  }
  .sentiment-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
  }
  .sentiment-summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 0.75rem;
    margin-top: 1rem;
  }
  .sentiment-metric {
    padding: 0.9rem 1rem;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    background: rgba(255, 255, 255, 0.03);
  }
  .sentiment-metric span {
    display: block;
    color: var(--muted);
    font-size: 0.82rem;
    margin-bottom: 0.3rem;
  }
  .sentiment-metric strong {
    font-size: 1.4rem;
  }
  .board-pill {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.25rem 0.6rem;
    border-radius: 999px;
    font-size: 0.82rem;
    color: #bfdbfe;
    background: rgba(59, 130, 246, 0.14);
    border: 1px solid rgba(59, 130, 246, 0.35);
  }
  .chart-card {
    min-height: 520px;
  }
  .chart-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 0.8rem;
  }
  #sentiment-chart {
    height: 440px;
  }
  .board-picker { position: relative; min-width: 260px; }
  .board-selected { display: flex; flex-wrap: wrap; gap: 0.35rem; min-height: 2rem; margin-bottom: 0.35rem; }
  .board-tag { padding: 0.15rem 0.5rem; border-radius: 999px; background: rgba(59,130,246,.15); border: 1px solid rgba(59,130,246,.35); }
  .board-tag button { margin-left: 0.35rem; background: transparent; border: 0; color: inherit; cursor: pointer; }
  .board-dropdown { position: absolute; top: calc(100% + 0.25rem); left: 0; right: 0; max-height: 240px; overflow: auto; background: #0b1220; border: 1px solid rgba(255,255,255,.12); border-radius: 8px; z-index: 20; }
  .board-option { display: block; width: 100%; padding: 0.55rem 0.75rem; cursor: pointer; background: transparent; border: 0; color: inherit; text-align: left; }
  .board-option:hover { background: rgba(255,255,255,.06); }
  .board-placeholder { color: var(--muted); font-size: 0.875rem; }
</style>

<div class="page-head">
  <h1>板块情绪</h1>
  <p class="muted">板块情绪评分曲线，横轴为交易时间，纵轴为 0-100 分。</p>
</div>

<div id="page-error" class="alert alert-error hidden"></div>

<div class="sentiment-layout">
  <section class="card filters-card">
    <div class="filters">
      <label class="filter-field">
        <span>交易日期</span>
        <input type="date" id="trade-date" class="date-input" />
      </label>
      <label class="filter-field">
        <span>历史区间</span>
        <select id="days">
          <option value="30" selected>近30天</option>
          <option value="120">近120日</option>
          <option value="180">近180日</option>
          <option value="240">近240日</option>
          <option value="365">近1年</option>
        </select>
      </label>
      <label class="filter-field filter-field--wide">
        <span>板块类型</span>
        <div class="chip-group" id="content-type-chips">
          <button type="button" class="chip active" data-value="行业">行业</button>
          <button type="button" class="chip active" data-value="概念">概念</button>
        </div>
      </label>
      <label class="filter-field filter-field--grow">
        <span>板块（默认全部，可输入名称/代码搜索后点选）</span>
        <div class="board-picker" id="board-picker">
          <div class="board-selected" id="board-selected"></div>
          <input
            type="text"
            id="board-search"
            class="board-search"
            placeholder="输入板块名称或代码，模糊匹配…"
            autocomplete="off"
          />
          <div class="board-dropdown hidden" id="board-dropdown"></div>
        </div>
      </label>
      <div class="filter-actions">
        <button type="button" class="btn btn-primary" id="btn-query">查询</button>
        <button type="button" class="btn btn-ghost" id="btn-reset-boards">清空板块</button>
      </div>
    </div>
    <p id="filter-hint" class="filter-hint muted"></p>
  </section>

  <section class="card">
    <div class="sentiment-head">
      <div>
        <h2 class="section-title">情绪概览</h2>
        <p id="summary-text" class="muted section-desc">加载中…</p>
      </div>
      <div id="board-pill" class="board-pill hidden"></div>
    </div>
    <div id="summary-metrics" class="sentiment-summary"></div>
  </section>

  <section class="card chart-card">
    <div class="chart-toolbar">
      <div>
        <h2 class="section-title">情绪曲线</h2>
        <p class="muted section-desc">近30天默认展示所选板块情绪</p>
      </div>
    </div>
    <div id="chart-empty" class="table-empty hidden">暂无情绪历史数据</div>
    <div id="sentiment-chart"></div>
  </section>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script src="/static/js/dc_board_common.js?v=20260702"></script>
<script src="/static/js/dc_sentiment.js?v=20260709"></script>
{% endblock %}
