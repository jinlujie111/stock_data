{% extends "app_layout.html" %}
{% block app_content %}
<div class="page-head">
  <h1>欢迎，{{ user.username }}</h1>
  <p class="muted">东方财富五维板块数据：资金强度、趋势强度、市场热度、产业景气、扩散效应。</p>
</div>
<div class="dash-grid">
  {% for item in nav_items %}
  <a href="{{ item.href }}" class="dash-card">
    <div class="dash-card-title">{{ item.label }}</div>
    <div class="dash-card-desc">查看东财板块明细列表</div>
  </a>
  {% endfor %}
</div>
{% endblock %}
