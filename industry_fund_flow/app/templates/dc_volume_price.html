{% extends "app_layout.html" %}
{% block app_content %}
<div class="page-head">
  <h1>板块量价</h1>
  <p class="muted">东财行业/概念 · 量比 · 量价配合 · VP 评分榜</p>
</div>

<div class="card filters-card">
  <div class="filters">
    <label class="filter-field">
      <span>交易日期</span>
      <select id="trade-date"></select>
    </label>
    <label class="filter-field">
      <span>板块类型</span>
      <select id="content-types">
        <option value="行业,概念">行业+概念</option>
        <option value="行业">行业</option>
        <option value="概念">概念</option>
      </select>
    </label>
    <label class="filter-field">
      <span>周期</span>
      <select id="window">
        <option value="20" selected>20日</option>
      </select>
    </label>
    <label class="filter-field filter-field--grow">
      <span>板块（默认全部，可输入名称/代码搜索后点选）</span>
      <div class="board-picker" id="board-picker">
        <div class="board-selected" id="board-selected"></div>
        <input type="text" id="board-search" class="board-search" placeholder="输入板块名称或代码，模糊匹配…" autocomplete="off" />
        <div class="board-dropdown hidden" id="board-dropdown"></div>
      </div>
    </label>
    <div class="filter-actions">
      <button type="button" class="btn btn-primary" id="btn-query">查询</button>
      <button type="button" class="btn btn-ghost" id="btn-reset-boards">清空板块</button>
    </div>
  </div>
</div>

<div id="page-error" class="alert alert-error hidden"></div>

<div class="card">
  <div class="tabs">
    <button type="button" class="tab active" data-tab="rank">VP 评分榜</button>
    <button type="button" class="tab" data-tab="signals">信号</button>
  </div>
  <div class="table-wrap">
    <table class="data-table" id="vp-table">
      <thead id="vp-thead"></thead>
      <tbody id="vp-body"></tbody>
    </table>
  </div>
  <p id="vp-empty" class="muted hidden">暂无数据，请先运行 run_vp_batch</p>
</div>

<div class="card hidden" id="detail-card">
  <h2 id="detail-title">板块详情</h2>
  <div id="detail-metrics" class="metric-grid"></div>

  <div class="vp-kline-section">
    <div class="vp-kline-head">
      <h3>板块 K 线 · VP 指标</h3>
      <p class="muted filter-hint">默认展示结束日前 60 个交易日；调整区间后点击「刷新 K 线」</p>
    </div>
    <div class="filters kline-range-filters">
      <label class="filter-field">
        <span>开始日期</span>
        <input type="date" id="kline-start" class="date-input" />
      </label>
      <label class="filter-field">
        <span>结束日期</span>
        <input type="date" id="kline-end" class="date-input" />
      </label>
      <div class="filter-field">
        <span>快捷</span>
        <div class="chip-group" id="kline-range-presets">
          <button type="button" class="chip" data-days="20">20日</button>
          <button type="button" class="chip active" data-days="60">60日</button>
          <button type="button" class="chip" data-days="120">120日</button>
        </div>
      </div>
      <div class="filter-actions">
        <button type="button" class="btn btn-primary" id="btn-kline-refresh">刷新 K 线</button>
      </div>
    </div>
    <div id="vp-kline-chart" class="kline-chart-host vp-kline-chart"></div>
  </div>

  <h3>成分股量价 Top</h3>
  <div class="table-wrap">
    <table class="data-table">
      <thead>
        <tr>
          <th>代码</th>
          <th>名称</th>
          <th>涨跌幅%</th>
          <th>量比</th>
          <th>连续放量</th>
          <th>突破60</th>
          <th>量价形态</th>
          <th>形态分</th>
          <th>K线分析</th>
        </tr>
      </thead>
      <tbody id="detail-stocks"></tbody>
    </table>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<script src="/static/js/dc_board_common.js?v=20260712b"></script>
<script src="/static/js/dc_kline_chart.js?v=20260712b"></script>
<script src="/static/js/dc_volume_price.js?v=20260712b"></script>
{% endblock %}
