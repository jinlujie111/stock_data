# instockdetail.com → 行业资金流网站 (uvicorn 127.0.0.1:8082)
#
# 安装:
#   sudo cp industry_fund_flow/deploy/nginx_instockdetail.com.conf \
#           /etc/nginx/sites-available/instockdetail.com
#   sudo ln -sf /etc/nginx/sites-available/instockdetail.com \
#           /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# DNS（在域名注册商）:
#   A  @    → 120.26.103.34
#   A  www  → 120.26.103.34
#
# 防火墙: 放行 80（HTTPS 再放行 443）

server {
    listen 80;
    server_name instockdetail.com www.instockdetail.com;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
