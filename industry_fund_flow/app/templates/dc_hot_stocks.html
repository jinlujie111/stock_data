{% extends "app_layout.html" %}
{% block app_content %}
<div class="page-head">
  <h1>热点股预览</h1>
  <p class="muted">东方财富 App 热榜 · 人气榜 / 飙升榜（数据源 ods_dc_hot_di）</p>
</div>

<div id="page-error" class="alert alert-error hidden"></div>

<div class="card filters-card">
  <div class="filters">
    <label class="filter-field">
      <span>交易日期</span>
      <input type="date" id="trade-date" class="date-input" />
    </label>
    <label class="filter-field filter-field--wide">
      <span>市场</span>
      <div class="chip-group" id="market-chips">
        {% for m in markets %}
        <button type="button" class="chip{% if loop.first %} active{% endif %}" data-value="{{ m }}">{{ m }}</button>
        {% endfor %}
      </div>
    </label>
    <div class="filter-actions">
      <button type="button" class="btn btn-primary" id="btn-query">查询</button>
    </div>
  </div>
  <p id="filter-hint" class="filter-hint muted"></p>
</div>

<section class="card snapshot-card">
  <div class="snapshot-head snapshot-head--tabs">
    <div>
      <h2 class="section-title">热榜列表</h2>
      <p id="hot-updated" class="muted snapshot-time">—</p>
    </div>
    <div class="tab-group" id="hot-type-tabs">
      {% for ht in hot_types %}
      <button type="button" class="tab{% if loop.first %} active{% endif %}" data-type="{{ ht }}">{{ ht }}</button>
      {% endfor %}
    </div>
  </div>
  <div class="table-wrap snapshot-table-wrap">
    <table class="data-table snapshot-table" id="hot-table">
      <thead>
        <tr>
          <th>排名</th>
          <th>代码</th>
          <th>名称</th>
          <th>涨跌幅</th>
          <th>现价</th>
          <th>成交额</th>
          <th>换手</th>
          <th>市盈率</th>
          <th>更新时间</th>
          <th>K线分析</th>
        </tr>
      </thead>
      <tbody id="hot-body"></tbody>
    </table>
  </div>
  <div id="hot-empty" class="table-empty hidden">该交易日暂无热榜数据</div>
</section>
{% endblock %}

{% block scripts %}
<script src="/static/js/dc_board_common.js?v=20260714b"></script>
<script src="/static/js/dc_hot_stocks.js?v=20260710d"></script>
{% endblock %}
